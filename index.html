<!-- python3 -m http.server 8000 → http://localhost:8000 -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>SMD Regular WMS — Sorter Loop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="./config.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #1a1a2e; color: #eee; }
    body { display: flex; flex-direction: column; }

    #tabs { display: flex; background: #111; border-bottom: 2px solid #333; flex-shrink: 0; height: 38px; }
    .tab-btn { padding: 0 22px; background: none; border: none; color: #aaa; font-size: 13px; cursor: pointer; border-bottom: 3px solid transparent; }
    .tab-btn.active { color: #fff; border-bottom-color: #26a69a; }
    .tab-btn:hover:not(.active) { color: #ddd; background: #1a1a1a; }

    #tab-map { display: none; flex: 1; position: relative; }
    #tab-map.active { display: block; }
    #map { position: absolute; inset: 0; }
    .mapboxgl-popup-content { color: #111 !important; font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; padding: 14px 16px; border-radius: 8px; }
    .mapboxgl-popup-close-button { color: #444 !important; font-size: 18px; }

    #tab-sorter { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    #tab-sorter.active { display: flex; }

    #sorter-header { background: #111; padding: 5px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex-shrink: 0; border-bottom: 1px solid #333; }
    .badge-smd { background: #26a69a; color: #fff; padding: 2px 7px; border-radius: 4px; font-weight: 700; font-size: 12px; }
    #sorter-title { font-size: 14px; font-weight: 600; }
    #search-box { padding: 4px 8px; border-radius: 5px; border: 1px solid #555; background: #222; color: #eee; font-size: 12px; width: 140px; }
    .filter-sel { padding: 4px 7px; border-radius: 5px; border: 1px solid #555; background: #222; color: #eee; font-size: 12px; }
    #total-badge { background: #222; border: 1px solid #444; padding: 3px 9px; border-radius: 10px; font-size: 12px; color: #bbb; }
    #sorter-meta { margin-left: auto; font-size: 10px; color: #555; }
    #legend { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .leg-item { display: flex; align-items: center; gap: 3px; font-size: 11px; cursor: pointer; padding: 2px 5px; border-radius: 3px; border: 1px solid transparent; }
    .leg-item:hover { border-color: #555; }
    .leg-item.active-filter { border-color: #fff; background: #2a2a2a; }
    .leg-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

    #sorter-body  { flex: 1; overflow: hidden; position: relative; }
    #sorter-inner { display: flex; position: absolute; top: 0; left: 0; transform-origin: top left; gap: 0; padding: 8px; }

    .panel { display: flex; flex-direction: column; border-radius: 7px; overflow: hidden; }
    #left-panel  { background: #1e1e1e; border: 1px solid #444; min-width: 370px; }
    #right-panel { background: #f7f8fa; border: 1px solid #ccc; color: #111; min-width: 370px; }

    .panel-title { padding: 5px 10px; font-size: 11px; font-weight: 700; letter-spacing: .4px; display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    #left-panel  .panel-title { background: #111; color: #eee; }
    #right-panel .panel-title { background: #e0e0e0; color: #111; }
    .panel-title .dot { width: 12px; height: 12px; border-radius: 2px; }

    .finger-group { display: flex; align-items: stretch; border-bottom: 1px solid; flex-shrink: 0; }
    #left-panel  .finger-group { border-color: #2a2a2a; }
    #right-panel .finger-group { border-color: #ddd; }
    .finger-group:last-child { border-bottom: none; }

    .finger-label { display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; width: 32px; flex-shrink: 0; }
    #left-panel  .finger-label { background: #111; color: #fff; border-right: 1px solid #333; }
    #right-panel .finger-label { background: #fff; color: #111; border-right: 1px solid #ddd; }

    .finger-grid { flex: 1; display: flex; flex-direction: column; padding: 2px; gap: 2px; }
    .finger-row  { display: flex; gap: 2px; }

    .cell { flex: 1; height: 34px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; cursor: pointer; border: 2px solid transparent; transition: filter .12s, border-color .12s; user-select: none; }
    .cell:hover { filter: brightness(1.18); border-color: rgba(255,255,255,.55); z-index: 1; }
    .cell.highlighted { border-color: #fff !important; filter: brightness(1.3); }
    .cell.dimmed { opacity: .2; pointer-events: none; }
    #right-panel .cell:hover { border-color: rgba(0,0,0,.35); }
    #right-panel .cell.highlighted { border-color: #222 !important; }

    .g-section-wrap { flex: 1; padding: 2px; display: flex; flex-direction: column; gap: 2px; }
    .g-row { display: flex; gap: 2px; }
    .g-row .cell { height: 28px; font-size: 10px; flex: 1; }

    .r-section-wrap { flex: 1; padding: 2px; display: flex; flex-direction: column; gap: 2px; }
    .r-row { display: flex; gap: 2px; }
    .r-row .cell { height: 34px; font-size: 12px; flex: 1; }
    .tt-members { margin-top: 6px; font-size: 10px; color: #bbb; line-height: 1.6; word-break: break-all; max-width: 260px; }

    #conveyor { width: 50px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #161622; padding: 8px 0; }
    .conv-half { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .conv-track { width: 18px; background: #2a2a3a; border-radius: 9px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; padding: 4px 0; margin: 4px 0; }
    .conv-arrow { color: #555; font-size: 12px; }
    .conv-sep { width: 26px; height: 26px; background: #222; border-radius: 50%; border: 2px solid #333; flex-shrink: 0; margin: 3px 0; }
    .conv-label { font-size: 8px; color: #444; writing-mode: vertical-rl; letter-spacing: 1px; text-transform: uppercase; }

    #tt { position: fixed; background: #1e1e2e; color: #eee; padding: 9px 13px; border-radius: 7px; font-size: 11px; pointer-events: none; display: none; z-index: 999; border: 1px solid #444; box-shadow: 0 4px 18px rgba(0,0,0,.6); min-width: 160px; max-width: 280px; }
    .tt-nom  { font-size: 16px; font-weight: 800; margin-bottom: 5px; }
    .tt-row  { display: flex; justify-content: space-between; gap: 10px; margin-top: 2px; }
    .tt-lbl  { color: #777; }
  </style>
</head>
<body>

<div id="tabs">
  <button class="tab-btn active" onclick="showTab('sorter')">📦 Sorter Loop SMD</button>
  <button class="tab-btn" onclick="showTab('map')">🗺 Mapa de Cobertura</button>
</div>

<div id="tab-map"><div id="map"></div></div>

<div id="tab-sorter" class="active">
  <div id="sorter-header">
    <span class="badge-smd">SMD</span>
    <span id="sorter-title">Sorter Loop — RMRU</span>
    <input id="search-box" type="text" placeholder="Buscar (001, 301...)" oninput="applyFilters()">
    <select id="filter-proveedor" class="filter-sel" onchange="applyFilters()">
      <option value="">Todos los proveedores</option>
    </select>
    <select id="filter-finger" class="filter-sel" onchange="applyFilters()">
      <option value="">Todos los fingers</option>
    </select>
    <span id="total-badge">— total</span>
    <div id="legend"></div>
    <span id="sorter-meta"></span>
  </div>

  <div id="sorter-body">
    <div id="sorter-inner">
      <div id="left-panel" class="panel">
        <div class="panel-title"><span class="dot" style="background:#111;border:1px solid #555"></span>FONDO NEGRO → IZQUIERDA</div>
        <div id="left-fingers"></div>
      </div>
      <div id="conveyor">
        <div class="conv-half"><div class="conv-track"><div class="conv-arrow">▼</div><div class="conv-arrow">▼</div><div class="conv-arrow">▼</div></div></div>
        <div class="conv-sep"></div>
        <div class="conv-label">Sorter&nbsp;Loop</div>
        <div class="conv-sep"></div>
        <div class="conv-half"><div class="conv-track"><div class="conv-arrow">▲</div><div class="conv-arrow">▲</div><div class="conv-arrow">▲</div></div></div>
      </div>
      <div id="right-panel" class="panel">
        <div class="panel-title"><span class="dot" style="background:#eee;border:1px solid #aaa"></span>FONDO BLANCO → DERECHA</div>
        <div id="right-fingers"></div>
      </div>
    </div>
  </div>
</div>

<div id="tt"></div>

<script>
const GEOJSON = './SMD_Regular_23012026_1.geojson?v=20260529b';
const _MBT = atob('cGsuZXlKMUlqb2liWEl0T1RrdGJXbHVkWFJ2Y3lJc0ltRWlPaUpqYlRGbmRHRm9jRFV3Tm5Kc01tcHZiMlEyY1RaaU5HbDVJbjAuMGRsTkdqaVY5cjhuTGZaVTFkNl82Zw==');
const MAPBOX_TOKEN = (typeof window.MAPBOX_TOKEN !== 'undefined' && window.MAPBOX_TOKEN) ? window.MAPBOX_TOKEN : _MBT;

const PC = {
  '99minutos':'#5b8ed6','SP Viña':'#7fb3d3','Chevalier':'#26a69a',
  'PDQ':'#e53935','SP Renny':'#7855a0','Urbano':'#9e9e9e','Fedex':'#ff6600'
};
const pColor = p => PC[p] || '#888';
const isLight = h => { const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16); return(r*299+g*587+b*114)/1000>150; };

// LEFT (negro, color=1): D=011-020, E=051-060, F=031-040 + G section (200s individual)
const LEFT_FINGERS = [
  {f:'D', rows:[[11,12,13,14,15],[20,19,18,17,16]]},
  {f:'E', rows:[[51,52,53,54,55],[60,59,58,57,56]]},
  {f:'F', rows:[[31,32,33,34,35],[40,39,38,37,36]]},
];
const G_NOMS = ['201','202','203','204','205','206','207','208','209','210',
                '211','212','213','214','215','216','217','218','219','220',
                '221','222','223','224','225','226','227','228','229','230',
                '231','232','503'];

// RIGHT (blanco, color=0): B=001-010, A=021-030, C=041-050 + R section (series 300-700)
const RIGHT_FINGERS = [
  {f:'B', rows:[[1,2,3,4,5],[10,9,8,7,6]]},
  {f:'A', rows:[[21,22,23,24,25],[30,29,28,27,26]]},
  {f:'C', rows:[[41,42,43,44,45],[50,49,48,47,46]]},
];
const R_SERIES_LAYOUT = [[300,400,500],[700,600]];

let FM={}, allFeats=[], seriesMap={}, mapGL=null;

function showTab(id) {
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',(i===0&&id==='sorter')||(i===1&&id==='map')));
  document.getElementById('tab-map').classList.toggle('active',id==='map');
  document.getElementById('tab-sorter').classList.toggle('active',id==='sorter');
  if(id==='map'&&!mapGL) initMap();
  if(id==='map'&&mapGL) mapGL.resize();
}

const ttEl=document.getElementById('tt');
function showTip(e,nom) {
  const p=FM[nom]; if(!p) return;
  const c=pColor(p.proveedor);
  const fondo=(p.color_etiqueta===1||p.color_etiqueta==='1')?'Negro':'Blanco';
  ttEl.innerHTML=`<div class="tt-nom" style="color:${c}">${p.zonificacion}</div>
    <div class="tt-row"><span class="tt-lbl">Finger</span><strong>${p.finger}</strong></div>
    <div class="tt-row"><span class="tt-lbl">Fondo</span><strong>${fondo}</strong></div>
    <div class="tt-row"><span class="tt-lbl">Proveedor</span><strong style="color:${c}">${p.proveedor}</strong></div>
    <div class="tt-row"><span class="tt-lbl">Estación</span><strong>${p.station||'—'}</strong></div>
    <div class="tt-row"><span class="tt-lbl">Capacidad</span><strong>${p.capacity}</strong></div>
    <div class="tt-row"><span class="tt-lbl">Comuna</span><strong>${p.COMUNA||'—'}</strong></div>`;
  ttEl.style.display='block'; moveTip(e);
}
function showSeriesTip(e,series,members) {
  const provSet=[...new Set(members.map(n=>FM[n]?.proveedor).filter(Boolean))];
  const listed=members.slice(0,60).join(' · ')+(members.length>60?' …':'');
  ttEl.innerHTML=`<div class="tt-nom">Serie ${series}s</div>
    <div class="tt-row"><span class="tt-lbl">Posiciones</span><strong>${members.length}</strong></div>
    <div class="tt-row"><span class="tt-lbl">Proveedores</span><strong>${provSet.join(', ')}</strong></div>
    <div class="tt-members">${listed}</div>`;
  ttEl.style.display='block'; moveTip(e);
}
function moveTip(e) { ttEl.style.left=Math.min(e.clientX+14,innerWidth-290)+'px'; ttEl.style.top=Math.min(e.clientY+14,innerHeight-180)+'px'; }
function hideTip() { ttEl.style.display='none'; }

function mkCell(nom,isLeft) {
  const nomStr=String(nom).padStart(3,'0');
  const p=FM[nomStr];
  const d=document.createElement('div'); d.className='cell'; d.id='cell-'+nomStr; d.textContent=nomStr;
  if(p){const c=pColor(p.proveedor);d.style.background=c;d.style.color=isLight(c)?'#111':'#fff';}
  else{d.style.background=isLeft?'#252535':'#ddd';d.style.color=isLeft?'#444':'#aaa';}
  d.addEventListener('mouseenter',e=>showTip(e,nomStr));
  d.addEventListener('mousemove', e=>moveTip(e));
  d.addEventListener('mouseleave',hideTip);
  d.addEventListener('click',()=>{
    if(!p)return;
    document.querySelectorAll('.cell.highlighted').forEach(c=>c.classList.remove('highlighted'));
    d.classList.add('highlighted');
    showTab('map'); if(mapGL) flyTo(nomStr);
  });
  return d;
}

function mkSeriesCell(series) {
  const members=seriesMap[series]||[];
  const d=document.createElement('div'); d.className='cell'; d.textContent=String(series);
  const provCounts={};
  members.forEach(n=>{const pv=FM[n]?.proveedor;if(pv) provCounts[pv]=(provCounts[pv]||0)+1;});
  const dominant=Object.entries(provCounts).sort((a,b)=>b[1]-a[1])[0]?.[0];
  const c=dominant?pColor(dominant):'#555';
  d.style.background=c; d.style.color=isLight(c)?'#111':'#fff';
  d.addEventListener('mouseenter',e=>showSeriesTip(e,series,members));
  d.addEventListener('mousemove', e=>moveTip(e));
  d.addEventListener('mouseleave',hideTip);
  d.addEventListener('click',()=>{
    document.querySelectorAll('.cell.highlighted').forEach(c=>c.classList.remove('highlighted'));
    d.classList.add('highlighted');
    showTab('map'); if(mapGL&&members.length) highlightSeries(members);
  });
  return d;
}

function mkFinger(fd,isLeft) {
  const g=document.createElement('div');g.className='finger-group';
  const lbl=document.createElement('div');lbl.className='finger-label';lbl.textContent=fd.f;g.appendChild(lbl);
  const grid=document.createElement('div');grid.className='finger-grid';
  fd.rows.forEach(row=>{
    const r=document.createElement('div');r.className='finger-row';
    row.forEach(n=>r.appendChild(mkCell(n,isLeft)));
    grid.appendChild(r);
  });
  g.appendChild(grid); return g;
}

function mkGSection() {
  const g=document.createElement('div');g.className='finger-group';g.style.alignItems='flex-start';
  const lbl=document.createElement('div');lbl.className='finger-label';lbl.textContent='G';g.appendChild(lbl);
  const wrap=document.createElement('div');wrap.className='g-section-wrap';
  for(let i=0;i<G_NOMS.length;i+=5){
    const row=document.createElement('div');row.className='g-row';
    G_NOMS.slice(i,i+5).forEach(nom=>{
      const d=mkCell(nom,true); d.style.height='28px'; d.style.fontSize='10px'; row.appendChild(d);
    });
    wrap.appendChild(row);
  }
  g.appendChild(wrap); return g;
}

function mkRSection() {
  const g=document.createElement('div');g.className='finger-group';g.style.alignItems='flex-start';
  const lbl=document.createElement('div');lbl.className='finger-label';lbl.textContent='R';g.appendChild(lbl);
  const wrap=document.createElement('div');wrap.className='r-section-wrap';
  R_SERIES_LAYOUT.forEach(row=>{
    const r=document.createElement('div');r.className='r-row';
    row.forEach(s=>{if(seriesMap[s]?.length) r.appendChild(mkSeriesCell(s));});
    if(r.children.length) wrap.appendChild(r);
  });
  g.appendChild(wrap); return g;
}

function render() {
  const lf=document.getElementById('left-fingers');
  const rf=document.getElementById('right-fingers');
  lf.innerHTML=''; rf.innerHTML='';
  LEFT_FINGERS.forEach(fd=>lf.appendChild(mkFinger(fd,true)));
  lf.appendChild(mkGSection());
  RIGHT_FINGERS.forEach(fd=>rf.appendChild(mkFinger(fd,false)));
  rf.appendChild(mkRSection());
  scaleToFit();
}

function scaleToFit() {
  const body=document.getElementById('sorter-body');
  const inner=document.getElementById('sorter-inner');
  inner.style.transform='none';
  const scale=Math.min(body.clientWidth/inner.scrollWidth,body.clientHeight/inner.scrollHeight,1);
  inner.style.transform=`scale(${scale})`;
}
window.addEventListener('resize',scaleToFit);

function applyFilters() {
  const s=document.getElementById('search-box').value.trim().toLowerCase();
  const p=document.getElementById('filter-proveedor').value;
  const f=document.getElementById('filter-finger').value;
  let vis=0;
  document.querySelectorAll('.cell').forEach(cell=>{
    const nom=cell.id?.replace('cell-',''); if(!nom) return;
    const fp=FM[nom]; if(!fp) return;
    const ok=(!s||nom.includes(s)||fp.zonificacion?.toLowerCase().includes(s))&&(!p||fp.proveedor===p)&&(!f||fp.finger===f);
    cell.classList.toggle('dimmed',!ok); if(ok) vis++;
  });
  document.getElementById('total-badge').textContent=`${vis} posiciones`;
}

function buildControls() {
  const provs=[...new Set(allFeats.map(f=>f.properties.proveedor))].sort();
  const fingers=[...new Set(allFeats.map(f=>f.properties.finger).filter(Boolean))].sort();
  const ps=document.getElementById('filter-proveedor');
  const fs=document.getElementById('filter-finger');
  provs.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;ps.appendChild(o);});
  fingers.forEach(f=>{const o=document.createElement('option');o.value=f;o.textContent=`Finger ${f}`;fs.appendChild(o);});
  const leg=document.getElementById('legend');
  provs.forEach(p=>{
    const cnt=allFeats.filter(f=>f.properties.proveedor===p).length;
    const item=document.createElement('div');item.className='leg-item';
    item.innerHTML=`<span class="leg-dot" style="background:${pColor(p)}"></span>${p} <span style="color:#666">(${cnt})</span>`;
    item.addEventListener('click',()=>{
      const el=document.getElementById('filter-proveedor');
      el.value=el.value===p?'':p;
      document.querySelectorAll('.leg-item').forEach(i=>i.classList.remove('active-filter'));
      if(el.value===p)item.classList.add('active-filter');
      applyFilters();
    });
    leg.appendChild(item);
  });
}

function buildSeriesMap() {
  [300,400,500,600,700].forEach(base=>{
    seriesMap[base]=allFeats.filter(f=>{const n=parseInt(f.properties.nomenclatura);return n>=base&&n<base+100;}).map(f=>f.properties.nomenclatura).sort();
  });
}

function initMap() {
  mapboxgl.accessToken=MAPBOX_TOKEN;
  mapGL=new mapboxgl.Map({container:'map',style:'mapbox://styles/mapbox/streets-v11',center:[-71.543,-35.675],zoom:4.5});
  mapGL.addControl(new mapboxgl.NavigationControl());
  mapGL.on('load',()=>{
    mapGL.addSource('smd',{type:'geojson',data:GEOJSON});
    const cExpr=['match',['get','proveedor'],...Object.entries(PC).flat(),'#888'];
    mapGL.addLayer({id:'smd-fill',type:'fill',source:'smd',paint:{'fill-color':cExpr,'fill-opacity':0.45}});
    mapGL.addLayer({id:'smd-line',type:'line',source:'smd',paint:{'line-color':'#000','line-width':0.4}});
    mapGL.addLayer({id:'smd-hl',type:'fill',source:'smd',paint:{'fill-color':'#ff4400','fill-opacity':0.85},filter:['==','nomenclatura','__none__']});
    mapGL.addLayer({id:'smd-hl-line',type:'line',source:'smd',paint:{'line-color':'#ff4400','line-width':4},filter:['==','nomenclatura','__none__']});
    mapGL.on('click','smd-fill',e=>{
      const p=e.features[0].properties; const c=pColor(p.proveedor);
      const fondo=(p.color_etiqueta===1||p.color_etiqueta==='1')?'Negro':'Blanco';
      new mapboxgl.Popup({maxWidth:'320px'}).setLngLat(e.lngLat).setHTML(`
        <strong style="color:${c};font-size:14px">${p.zonificacion}</strong><br>
        <b>Finger:</b> ${p.finger} &nbsp; <b>Fondo:</b> ${fondo}<br>
        <b>Proveedor:</b> ${p.proveedor}<br>
        <b>Estación:</b> ${p.station||'—'}<br>
        <b>Capacidad:</b> ${p.capacity}<br>
        <hr style="border:none;border-top:1px solid #ddd;margin:6px 0">
        <b>Comuna:</b> <span style="font-size:11px;color:#444">${p.COMUNA||'—'}</span><br>
        <b>Región:</b> <span style="font-size:11px;color:#444">${p.REGION||'—'}</span>
      `).addTo(mapGL);
    });
    mapGL.on('mouseenter','smd-fill',()=>mapGL.getCanvas().style.cursor='pointer');
    mapGL.on('mouseleave','smd-fill',()=>mapGL.getCanvas().style.cursor='');
  });
}

function flyTo(nom) {
  fetch(GEOJSON).then(r=>r.json()).then(data=>{
    const feat=data.features.find(f=>f.properties.nomenclatura===nom); if(!feat) return;
    const coords=[]; const col=c=>{if(typeof c[0]==='number')coords.push(c);else c.forEach(col);}; col(feat.geometry.coordinates);
    if(!coords.length) return;
    const lons=coords.map(c=>c[0]),lats=coords.map(c=>c[1]);
    mapGL.fitBounds([[Math.min(...lons),Math.min(...lats)],[Math.max(...lons),Math.max(...lats)]],{padding:60,maxZoom:12});
    mapGL.setFilter('smd-hl',['==','nomenclatura',nom]);
    mapGL.setFilter('smd-hl-line',['==','nomenclatura',nom]);
    setTimeout(()=>{mapGL.setFilter('smd-hl',['==','nomenclatura','__none__']);mapGL.setFilter('smd-hl-line',['==','nomenclatura','__none__']);},3000);
  });
}

function highlightSeries(members) {
  mapGL.setFilter('smd-hl',['in','nomenclatura',...members]);
  mapGL.setFilter('smd-hl-line',['in','nomenclatura',...members]);
  setTimeout(()=>{mapGL.setFilter('smd-hl',['==','nomenclatura','__none__']);mapGL.setFilter('smd-hl-line',['==','nomenclatura','__none__']);},3000);
  const coords=[];
  allFeats.filter(f=>members.includes(f.properties.nomenclatura)).forEach(f=>{
    const col=c=>{if(typeof c[0]==='number')coords.push(c);else c.forEach(col);}; col(f.geometry.coordinates);
  });
  if(!coords.length) return;
  const lons=coords.map(c=>c[0]),lats=coords.map(c=>c[1]);
  mapGL.fitBounds([[Math.min(...lons),Math.min(...lats)],[Math.max(...lons),Math.max(...lats)]],{padding:50,maxZoom:10});
}

fetch(GEOJSON).then(r=>r.json()).then(data=>{
  allFeats=data.features;
  allFeats.forEach(f=>{FM[f.properties.nomenclatura]=f.properties;});
  const station=allFeats.find(f=>f.properties.station)?.properties.station||'';
  document.getElementById('sorter-title').textContent=`Sorter Loop — ${station}`;
  document.getElementById('sorter-meta').textContent=`${GEOJSON.split('/').pop().split('?')[0]} · ${allFeats.length} posiciones`;
  document.getElementById('total-badge').textContent=`${allFeats.length} total`;
  buildSeriesMap(); buildControls(); render();
});
</script>
